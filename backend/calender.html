<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NITC Events Calendar</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for a cleaner UI */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
        }
        .event-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .event-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        
        <!-- Header and Role Switch -->
        <header class="mb-8 p-4 bg-white rounded-xl shadow-lg flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-800">Campus Events</h1>
            <div class="flex items-center space-x-3">
                <span id="role-text" class="font-semibold text-blue-600">Viewing as User</span>
                <label for="role-switch" class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" id="role-switch" class="sr-only">
                        <div class="block bg-gray-600 w-14 h-8 rounded-full"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition"></div>
                    </div>
                </label>
            </div>
        </header>

        <!-- Admin Event Addition Form -->
        <div id="admin-panel" class="mb-8 p-6 bg-yellow-50 border-2 border-yellow-200 rounded-xl shadow-md hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Admin: Add New Event</h2>
            <form id="add-event-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-1">
                    <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
                    <input type="text" id="title" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2">
                </div>
                <div class="md:col-span-1">
                    <label for="start_date" class="block text-sm font-medium text-gray-700">Start Date/Time</label>
                    <input type="datetime-local" id="start_date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2">
                </div>
                <div class="md:col-span-2">
                    <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="description" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2"></textarea>
                </div>
                <div class="md:col-span-1">
                    <label for="end_date" class="block text-sm font-medium text-gray-700">End Date/Time (Optional)</label>
                    <input type="datetime-local" id="end_date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2">
                </div>
                <div class="md:col-span-2 flex justify-end">
                    <button type="submit" class="w-full md:w-auto px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-150">
                        Add Event
                    </button>
                </div>
            </form>
        </div>

        <!-- Event List -->
        <main class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Upcoming Events</h2>
            <div id="events-list" class="space-y-4">
                <p id="loading-indicator" class="text-gray-500 italic">Loading events...</p>
                <!-- Events will be rendered here -->
            </div>
            <div id="error-message" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-lg"></div>
        </main>

    </div>

    <script>
        // --- Core Application Logic ---
        const API_BASE_URL = 'http://127.0.0.1:5000/api/events';

        const eventsListEl = document.getElementById('events-list');
        const adminPanelEl = document.getElementById('admin-panel');
        const roleSwitchEl = document.getElementById('role-switch');
        const roleTextEl = document.getElementById('role-text');
        const addEventFormEl = document.getElementById('add-event-form');
        const loadingIndicatorEl = document.getElementById('loading-indicator');
        const errorEl = document.getElementById('error-message');
        
        // State
        let isAdmin = false;

        // --- Utility Functions ---

        function formatDateTime(dateTimeString) {
            if (!dateTimeString) return 'N/A';
            const date = new Date(dateTimeString);
            const options = { 
                year: 'numeric', month: 'short', day: 'numeric', 
                hour: '2-digit', minute: '2-digit', hour12: true 
            };
            return date.toLocaleString('en-US', options);
        }
        
        function showMessage(type, message) {
            errorEl.textContent = message;
            errorEl.className = `mt-4 p-3 rounded-lg block ${type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            setTimeout(() => {
                errorEl.className = 'hidden';
            }, 5000);
        }

        // --- Renderer ---

        function renderEvents(events) {
            eventsListEl.innerHTML = ''; // Clear existing events
            loadingIndicatorEl.style.display = 'none';

            if (events.length === 0) {
                eventsListEl.innerHTML = '<p class="text-gray-500 italic">No upcoming events scheduled.</p>';
                return;
            }

            events.forEach(event => {
                const eventCard = document.createElement('div');
                eventCard.className = 'event-card p-4 border border-gray-200 rounded-lg bg-gray-50 hover:bg-white shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center';
                
                // Event Details
                const details = `
                    <div class="flex-grow min-w-0 mb-3 sm:mb-0">
                        <div class="text-lg font-bold text-blue-700 truncate">${event.title}</div>
                        <div class="text-sm text-gray-600 mb-1">${formatDateTime(event.start_date)} 
                            ${event.end_date ? ' - ' + formatDateTime(event.end_date) : ''}
                        </div>
                        ${event.description ? `<p class="text-gray-700 text-sm mt-1">${event.description}</p>` : ''}
                    </div>
                `;
                
                eventCard.innerHTML = details;
                
                // Admin Actions (Delete Button)
                if (isAdmin) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.className = 'px-3 py-1 bg-red-500 text-white text-sm font-semibold rounded-full hover:bg-red-600 transition duration-150 flex-shrink-0 ml-4';
                    deleteBtn.onclick = () => handleDeleteEvent(event.event_id, event.title);
                    eventCard.appendChild(deleteBtn);
                }

                eventsListEl.appendChild(eventCard);
            });
        }

        // --- API & State Handlers ---

        async function fetchEvents() {
            loadingIndicatorEl.style.display = 'block';
            errorEl.className = 'hidden';
            try {
                const response = await fetch(API_BASE_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const events = await response.json();
                renderEvents(events);
            } catch (error) {
                console.error('Failed to fetch events:', error);
                loadingIndicatorEl.style.display = 'none';
                showMessage('error', `Could not connect to backend API or fetch events: ${error.message}`);
                eventsListEl.innerHTML = '<p class="text-red-500">Failed to load events. Please ensure the Flask server is running.</p>';
            }
        }

        async function handleAddEvent(e) {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const start_date = document.getElementById('start_date').value;
            const description = document.getElementById('description').value;
            const end_date = document.getElementById('end_date').value || null;

            // Simple validation: Ensure date is in the correct format for MySQL (ISO string)
            const eventData = {
                title: title,
                description: description,
                start_date: start_date.replace('T', ' ') + ':00', // Convert datetime-local to 'YYYY-MM-DD HH:MM:SS'
                end_date: end_date ? end_date.replace('T', ' ') + ':00' : null,
            };

            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        // In a real app, this would be a secure token, not a user ID
                        'X-User-Role': 'Admin' 
                    },
                    body: JSON.stringify(eventData)
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('success', `Event "${title}" added successfully!`);
                    addEventFormEl.reset();
                    fetchEvents(); // Refresh the list
                } else {
                    showMessage('error', `Failed to add event: ${result.message || 'Server error.'}`);
                }
            } catch (error) {
                console.error('Error adding event:', error);
                showMessage('error', 'Could not connect to server to add event.');
            }
        }

        async function handleDeleteEvent(eventId, eventTitle) {
            if (!isAdmin) {
                showMessage('error', 'You must be an Admin to delete events.');
                return;
            }
            
            // Custom Confirmation Modal (replacing forbidden alert/confirm)
            const confirmDelete = await showCustomModal(`Are you sure you want to delete the event: "${eventTitle}"?`);

            if (!confirmDelete) return;

            try {
                const response = await fetch(`${API_BASE_URL}/${eventId}`, {
                    method: 'DELETE',
                    headers: { 'X-User-Role': 'Admin' }
                });

                const result = await response.json();
                
                if (response.ok) {
                    showMessage('success', `Event ID ${eventId} ("${eventTitle}") deleted.`);
                    fetchEvents(); // Refresh the list
                } else {
                    showMessage('error', `Failed to delete event: ${result.message || 'Server error.'}`);
                }
            } catch (error) {
                console.error('Error deleting event:', error);
                showMessage('error', 'Could not connect to server to delete event.');
            }
        }

        function updateUIAccess() {
            if (isAdmin) {
                adminPanelEl.classList.remove('hidden');
                roleTextEl.textContent = 'Viewing as Admin';
                roleTextEl.classList.remove('text-blue-600');
                roleTextEl.classList.add('text-red-600');
            } else {
                adminPanelEl.classList.add('hidden');
                roleTextEl.textContent = 'Viewing as User';
                roleTextEl.classList.remove('text-red-600');
                roleTextEl.classList.add('text-blue-600');
            }
            // Re-render events to show/hide delete buttons
            fetchEvents();
        }

        // --- Event Listeners and Initial Load ---
        
        roleSwitchEl.addEventListener('change', (e) => {
            isAdmin = e.target.checked;
            // The switch's dot movement is handled by Tailwind's dot class in the style block
            const dot = document.querySelector('#role-switch + div + .dot');
            if (isAdmin) {
                dot.style.transform = 'translateX(100%)';
                dot.classList.remove('bg-white');
                dot.classList.add('bg-red-500');
            } else {
                dot.style.transform = 'translateX(0)';
                dot.classList.remove('bg-red-500');
                dot.classList.add('bg-white');
            }
            updateUIAccess();
        });

        addEventFormEl.addEventListener('submit', handleAddEvent);

        // Function to create a custom modal for confirmations
        function showCustomModal(message) {
            return new Promise(resolve => {
                const existingModal = document.getElementById('custom-modal');
                if (existingModal) existingModal.remove();

                const modalHTML = `
                    <div id="custom-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center p-4">
                        <div class="bg-white rounded-lg shadow-2xl p-6 w-full max-w-sm">
                            <p class="text-lg font-semibold mb-6">${message}</p>
                            <div class="flex justify-end space-x-3">
                                <button id="modal-cancel" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300">Cancel</button>
                                <button id="modal-confirm" class="px-4 py-2 text-white bg-red-500 rounded-lg hover:bg-red-600">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHTML);

                const modalEl = document.getElementById('custom-modal');
                const confirmBtn = document.getElementById('modal-confirm');
                const cancelBtn = document.getElementById('modal-cancel');

                const cleanup = (result) => {
                    modalEl.remove();
                    resolve(result);
                };

                confirmBtn.onclick = () => cleanup(true);
                cancelBtn.onclick = () => cleanup(false);
            });
        }
        
        // Initial load
        window.onload = () => {
            updateUIAccess(); // Sets initial role (User) and fetches events
        };

    </script>
</body>
</html>
